version: 1
# Amplify deployment configuration
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          # Install dependencies for all Amplify functions
          # This ensures TypeScript can find module types during validation
          for dir in amplify/functions/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing dependencies for $(basename $dir)..."
              cd "$dir"
              if [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi
              if [ $? -ne 0 ]; then
                echo "Failed to install dependencies for $(basename $dir)"
                exit 1
              fi
              echo "Verifying installation for $(basename $dir)..."
              ls -la node_modules/ | head -5 || echo "node_modules directory not found"
              if [ -d "node_modules/nodemailer" ]; then
                echo "✓ nodemailer installed"
              else
                echo "✗ nodemailer NOT found"
              fi
              if [ -d "node_modules/imapflow" ]; then
                echo "✓ imapflow installed"
              else
                echo "✗ imapflow NOT found"
              fi
              cd - > /dev/null
            fi
          done
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          fi
          if [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          fi
        - npx expo export --platform web --output-dir web-build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

