version: 1
# Amplify deployment configuration
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "=== Starting function dependency installation ==="
        - cd amplify/functions/testMailboxConnection && npm install && cd - || (echo "Failed to install testMailboxConnection dependencies" && exit 1)
        - cd amplify/functions/enrollmentMetric && npm install && cd - || (echo "Failed to install enrollmentMetric dependencies" && exit 1)
        - cd amplify/functions/sendInvitationEmail && npm install && cd - || (echo "Failed to install sendInvitationEmail dependencies" && exit 1)
        - cd amplify/functions/fetchEmailAttachment && npm install && cd - || (echo "Failed to install fetchEmailAttachment dependencies" && exit 1)
        - |
          FLAG="$(echo "${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" != "false" ] && [ "$FLAG" != "0" ]; then
            cd amplify/functions/launchSmartleadMigration && npm install && cd - || (echo "Failed to install launchSmartleadMigration dependencies" && exit 1)
          else
            echo "Skipping launchSmartleadMigration npm install (AMPLIFY_ENABLE_SMARTLEAD_MIGRATION disabled)"
          fi
        - echo "=== Function dependencies installed successfully ==="
        - |
          PROD_BRANCH="${PROD_BRANCH:-main}"
          if [ "$AWS_BRANCH" = "$PROD_BRANCH" ]; then
            WORKER_ENVIRONMENT=prod
          else
            WORKER_ENVIRONMENT=dev
          fi
          echo "Resolved WORKER_ENVIRONMENT=$WORKER_ENVIRONMENT for branch $AWS_BRANCH"
          FLAG="$(echo "${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" != "false" ] && [ "$FLAG" != "0" ]; then
            REQUIRED_EXPORTS=(
              "FurnaceCluster-$WORKER_ENVIRONMENT"
              "FurnaceWorkerSecurityGroup-$WORKER_ENVIRONMENT"
              "FurnaceWorkerPublicSubnets-$WORKER_ENVIRONMENT"
              "FurnaceSmartleadMigrationTaskDefinition-$WORKER_ENVIRONMENT"
            )
            for export_name in "${REQUIRED_EXPORTS[@]}"; do
              export_value=$(aws cloudformation list-exports \
                --query "Exports[?Name=='${export_name}'].Value | [0]" \
                --output text)
              if [ -z "$export_value" ] || [ "$export_value" = "None" ]; then
                echo "Missing CloudFormation export: $export_name"
                echo "Deploy infra/workers for $WORKER_ENVIRONMENT before running Amplify backend deployment."
                exit 1
              fi
            done
          else
            echo "Skipping worker stack export check (AMPLIFY_ENABLE_SMARTLEAD_MIGRATION disabled)"
          fi
          AMPLIFY_ENABLE_SMARTLEAD_MIGRATION="${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" \
            WORKER_ENVIRONMENT="$WORKER_ENVIRONMENT" \
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          fi
          if [ -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> .env
          fi
        - npx expo export --platform web --output-dir web-build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

