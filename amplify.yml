version: 1
# Amplify deployment configuration
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          # Install dependencies for all Amplify functions
          # This ensures TypeScript can find module types during validation
          for dir in amplify/functions/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "=== Installing dependencies for $(basename $dir) ==="
              cd "$dir"
              pwd
              if [ -f "package-lock.json" ]; then
                npm ci
              else
                npm install
              fi
              INSTALL_EXIT=$?
              if [ $INSTALL_EXIT -ne 0 ]; then
                echo "ERROR: Failed to install dependencies for $(basename $dir) (exit code: $INSTALL_EXIT)"
                exit 1
              fi
              echo "=== Verifying installation for $(basename $dir) ==="
              if [ -d "node_modules" ]; then
                echo "node_modules directory exists"
                ls -la node_modules/ | head -10
              else
                echo "ERROR: node_modules directory NOT found"
                exit 1
              fi
              if [ -d "node_modules/nodemailer" ]; then
                echo "✓ nodemailer installed at: $(realpath node_modules/nodemailer)"
              else
                echo "✗ ERROR: nodemailer NOT found"
                exit 1
              fi
              if [ -d "node_modules/imapflow" ]; then
                echo "✓ imapflow installed at: $(realpath node_modules/imapflow)"
              else
                echo "✗ ERROR: imapflow NOT found"
                exit 1
              fi
              echo "=== Testing TypeScript resolution from function directory ==="
              cd "$dir"
              npx tsc --noEmit --skipLibCheck handler.ts 2>&1 | head -20 || echo "TypeScript check completed"
              cd - > /dev/null
            fi
          done
        - echo "=== Running ampx pipeline-deploy ==="
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          fi
          if [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          fi
        - npx expo export --platform web --output-dir web-build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

