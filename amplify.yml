version: 1
# Amplify deployment configuration
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - node scripts/verify-amplify-yml-installs.mjs
        - echo "=== Starting function dependency installation ==="
        - cd amplify/functions/testMailboxConnection && npm install && cd - || (echo "Failed to install testMailboxConnection dependencies" && exit 1)
        - cd amplify/functions/enrollmentMetric && npm install && cd - || (echo "Failed to install enrollmentMetric dependencies" && exit 1)
        - cd amplify/functions/sendInvitationEmail && npm install && cd - || (echo "Failed to install sendInvitationEmail dependencies" && exit 1)
        - cd amplify/functions/fetchEmailAttachment && npm install && cd - || (echo "Failed to install fetchEmailAttachment dependencies" && exit 1)
        - cd amplify/functions/foundryRegistryApi && npm install && cd - || (echo "Failed to install foundryRegistryApi dependencies" && exit 1)
        - cd amplify/functions/foundryNormalizeJob && npm install && cd - || (echo "Failed to install foundryNormalizeJob dependencies" && exit 1)
        - cd amplify/functions/foundryAutolinkJob && npm install && cd - || (echo "Failed to install foundryAutolinkJob dependencies" && exit 1)
        - cd amplify/functions/foundryContactEnrichmentJob && npm install && cd - || (echo "Failed to install foundryContactEnrichmentJob dependencies" && exit 1)
        - cd amplify/functions/foundryStateMatchingJob && npm install && cd - || (echo "Failed to install foundryStateMatchingJob dependencies" && exit 1)
        - cd amplify/functions/foundryWebsiteVerificationJob && npm install && cd - || (echo "Failed to install foundryWebsiteVerificationJob dependencies" && exit 1)
        - cd amplify/functions/foundryGoogleAdsVerificationJob && npm install && cd - || (echo "Failed to install foundryGoogleAdsVerificationJob dependencies" && exit 1)
        - cd amplify/functions/foundryCsvBuilderExportJob && npm install && cd - || (echo "Failed to install foundryCsvBuilderExportJob dependencies" && exit 1)
        - cd amplify/functions/googlePlaces && npm install && cd - || (echo "Failed to install googlePlaces dependencies" && exit 1)
        - cd amplify/functions/processNotificationEvent && npm install && cd - || (echo "Failed to install processNotificationEvent dependencies" && exit 1)
        - cd amplify/functions/fluxCompetitorAuditStart && npm install && cd - || (echo "Failed to install fluxCompetitorAuditStart dependencies" && exit 1)
        - cd amplify/functions/fluxGenerate && npm install && cd - || (echo "Failed to install fluxGenerate dependencies" && exit 1)
        - cd amplify/functions/fluxEditorChat && npm install && cd - || (echo "Failed to install fluxEditorChat dependencies" && exit 1)
        - cd amplify/functions/sendFluxQuizSubmission && npm install && cd - || (echo "Failed to install sendFluxQuizSubmission dependencies" && exit 1)
        - |
          FLAG="$(echo "${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" != "false" ] && [ "$FLAG" != "0" ]; then
            cd amplify/functions/launchSmartleadMigration && npm install && cd - || (echo "Failed to install launchSmartleadMigration dependencies" && exit 1)
          else
            echo "Skipping launchSmartleadMigration npm install (AMPLIFY_ENABLE_SMARTLEAD_MIGRATION disabled)"
          fi
        - echo "=== Function dependencies installed successfully ==="
        - |
          PROD_BRANCH="${PROD_BRANCH:-main}"
          if [ "$AWS_BRANCH" = "$PROD_BRANCH" ]; then
            WORKER_ENVIRONMENT=prod
          else
            WORKER_ENVIRONMENT=dev
          fi
          echo "Resolved WORKER_ENVIRONMENT=$WORKER_ENVIRONMENT for branch $AWS_BRANCH"
          # Must match infra/workers CDK region (SSM + CFN exports are regional). Override in Amplify env if needed.
          WORKER_STACK_REGION="${FURNACE_WORKER_STACK_REGION:-${AWS_REGION:-us-west-2}}"
          echo "Using WORKER_STACK_REGION=$WORKER_STACK_REGION for worker stack pre-checks"
          REQUIRED_EXPORTS=(
            "FurnaceCluster-$WORKER_ENVIRONMENT"
            "FurnaceWorkerSecurityGroup-$WORKER_ENVIRONMENT"
            "FurnaceWorkerPublicSubnets-$WORKER_ENVIRONMENT"
            "FurnaceEcsTaskExecutionRole-$WORKER_ENVIRONMENT"
            "FurnaceUtahScraperTaskRole-$WORKER_ENVIRONMENT"
            "FurnaceFloridaScraperTaskRole-$WORKER_ENVIRONMENT"
            "FurnaceWebsiteVerificationTaskRole-$WORKER_ENVIRONMENT"
            "FurnaceGoogleAdsVerificationTaskRole-$WORKER_ENVIRONMENT"
          )
          for export_name in "${REQUIRED_EXPORTS[@]}"; do
            export_value=$(aws cloudformation list-exports \
              --region "$WORKER_STACK_REGION" \
              --query "Exports[?Name=='${export_name}'].Value | [0]" \
              --output text)
            if [ -z "$export_value" ] || [ "$export_value" = "None" ]; then
              echo "Missing CloudFormation export: $export_name (region $WORKER_STACK_REGION)"
              echo "Deploy infra/workers for $WORKER_ENVIRONMENT before running Amplify backend deployment."
              exit 1
            fi
          done
          EMBED_NOTIF="$(echo "${AMPLIFY_EMBED_NOTIFICATION_QUEUE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$EMBED_NOTIF" = "true" ] || [ "$EMBED_NOTIF" = "1" ] || [ "$EMBED_NOTIF" = "yes" ]; then
            echo "Skipping FurnaceNotificationEventsQueueArn check (AMPLIFY_EMBED_NOTIFICATION_QUEUE)"
          elif [ -n "${AMPLIFY_NOTIFICATION_QUEUE_ARN:-}" ]; then
            echo "Skipping FurnaceNotificationEventsQueueArn check (AMPLIFY_NOTIFICATION_QUEUE_ARN set)"
          else
            NOTIF_EXPORT="FurnaceNotificationEventsQueueArn-$WORKER_ENVIRONMENT"
            export_value=$(aws cloudformation list-exports \
              --region "$WORKER_STACK_REGION" \
              --query "Exports[?Name=='${NOTIF_EXPORT}'].Value | [0]" \
              --output text)
            if [ -z "$export_value" ] || [ "$export_value" = "None" ]; then
              echo "Missing CloudFormation export: $NOTIF_EXPORT (region $WORKER_STACK_REGION)"
              echo "Deploy infra/workers for $WORKER_ENVIRONMENT so the notification-events queue and this export exist."
              echo "Or set AMPLIFY_EMBED_NOTIFICATION_QUEUE or AMPLIFY_NOTIFICATION_QUEUE_ARN (see docs/notifications/NOTIFICATIONS.md)."
              exit 1
            fi
          fi
          REQUIRED_SSM_PARAMS=(
            "/furnace/ecs/${WORKER_ENVIRONMENT}/utah-scraper/task-definition-arn"
            "/furnace/ecs/${WORKER_ENVIRONMENT}/florida-scraper/task-definition-arn"
            "/furnace/ecs/${WORKER_ENVIRONMENT}/website-verification/task-definition-arn"
            "/furnace/ecs/${WORKER_ENVIRONMENT}/google-ads-verification/task-definition-arn"
          )
          for param_name in "${REQUIRED_SSM_PARAMS[@]}"; do
            if ! aws ssm get-parameter --name "$param_name" --region "$WORKER_STACK_REGION" --query Parameter.Name --output text >/dev/null 2>&1; then
              echo "SSM check failed: $param_name (region $WORKER_STACK_REGION)"
              aws ssm get-parameter --name "$param_name" --region "$WORKER_STACK_REGION" || true
              echo "If AccessDenied: add ssm:GetParameter on arn:aws:ssm:${WORKER_STACK_REGION}:*:parameter/furnace/ecs/* to this app’s Amplify build (service) role in IAM."
              echo "If ParameterNotFound: deploy infra/workers for $WORKER_ENVIRONMENT (publishes task-definition-arn to SSM)."
              exit 1
            fi
          done
          FLAG="$(echo "${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" != "false" ] && [ "$FLAG" != "0" ]; then
            REQUIRED_EXPORTS=(
              "FurnaceCluster-$WORKER_ENVIRONMENT"
              "FurnaceWorkerSecurityGroup-$WORKER_ENVIRONMENT"
              "FurnaceWorkerPublicSubnets-$WORKER_ENVIRONMENT"
            )
            for export_name in "${REQUIRED_EXPORTS[@]}"; do
              export_value=$(aws cloudformation list-exports \
                --region "$WORKER_STACK_REGION" \
                --query "Exports[?Name=='${export_name}'].Value | [0]" \
                --output text)
              if [ -z "$export_value" ] || [ "$export_value" = "None" ]; then
                echo "Missing CloudFormation export: $export_name (region $WORKER_STACK_REGION)"
                echo "Deploy infra/workers for $WORKER_ENVIRONMENT before running Amplify backend deployment."
                exit 1
              fi
            done
            TASK_DEF_PARAM="/furnace/ecs/${WORKER_ENVIRONMENT}/smartlead-migration/task-definition-arn"
            if ! aws ssm get-parameter --name "$TASK_DEF_PARAM" --region "$WORKER_STACK_REGION" --query Parameter.Name --output text >/dev/null 2>&1; then
              echo "SSM check failed: $TASK_DEF_PARAM (region $WORKER_STACK_REGION)"
              aws ssm get-parameter --name "$TASK_DEF_PARAM" --region "$WORKER_STACK_REGION" || true
              echo "If AccessDenied: add ssm:GetParameter on arn:aws:ssm:${WORKER_STACK_REGION}:*:parameter/furnace/ecs/* to this app’s Amplify build (service) role in IAM."
              echo "If ParameterNotFound: deploy infra/workers for $WORKER_ENVIRONMENT so the Smartlead task definition ARN is published to SSM."
              exit 1
            fi
          else
            echo "Skipping worker stack export check (AMPLIFY_ENABLE_SMARTLEAD_MIGRATION disabled)"
          fi
          AMPLIFY_ENABLE_SMARTLEAD_MIGRATION="${AMPLIFY_ENABLE_SMARTLEAD_MIGRATION:-}" \
            WORKER_ENVIRONMENT="$WORKER_ENVIRONMENT" \
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          fi
          if [ -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> .env
          fi
          # Same public key as Amplify secret WEB_PUSH_VAPID_PUBLIC_KEY (embedded at export time for PWA subscribe).
          if [ -n "$EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" ]; then
            echo "EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY=$EXPO_PUBLIC_WEB_PUSH_VAPID_PUBLIC_KEY" >> .env
          fi
        - npx expo export --platform web --output-dir web-build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

