version: 1
# Amplify deployment configuration
backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - |
          # CRITICAL: Install function dependencies BEFORE ampx runs
          # Amplify Gen 2's bundler needs these available during synthesis
          echo "=== Installing function dependencies ==="
          for dir in amplify/functions/*/; do
            if [ -f "$dir/package.json" ]; then
              func_name=$(basename "$dir")
              echo "[$func_name] Installing dependencies..."
              cd "$dir"
              if [ -f "package-lock.json" ]; then
                npm ci --loglevel=error
              else
                npm install --loglevel=error
              fi
              if [ $? -ne 0 ]; then
                echo "[$func_name] ERROR: Installation failed"
                exit 1
              fi
              # Verify critical packages
              if [ "$func_name" = "testMailboxConnection" ]; then
                if [ ! -d "node_modules/nodemailer" ] || [ ! -d "node_modules/imapflow" ]; then
                  echo "[$func_name] ERROR: Required packages missing"
                  ls -la node_modules/ 2>/dev/null | grep -E "(nodemailer|imapflow)" || echo "Packages not found"
                  exit 1
                fi
                echo "[$func_name] ✓ Dependencies verified"
              fi
              cd - > /dev/null
            fi
          done
          echo "=== Function dependencies installed ==="
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    build:
      commands:
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18
        - nvm use 18
        - npm ci
    build:
      commands:
        - |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> .env
          fi
          if [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env
          fi
        - npx expo export --platform web --output-dir web-build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

