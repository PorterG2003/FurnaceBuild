# Amplify Hosting custom headers.
# index.html and sw.js must not be CDN-cached long-term or PWAs keep stale JS after deploy.
customHeaders:
  - pattern: 'index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: 'sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: 'manifest.json'
    headers:
      - key: Cache-Control
        value: 'no-cache, must-revalidate'
  - pattern: '_expo/static/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
